<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — SowonAI</title>
<link rel="icon" href="/assets/sowonai-logo-mark.svg" type="image/svg+xml">
<link rel="icon" href="/assets/sowonai-favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/sowonai-apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#f8fafc">
<style>
  :root { --bg: #f8fafc; --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --line: #e2e8f0; --blue: #2f6fe8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; width: 100%; }
  header { border-bottom: 1px solid rgba(226,232,240,.7); }
  header .wrap { display: flex; align-items: center; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
  .logo img { width: 30px; height: 30px; object-fit: contain; }
  main { flex: 1; display: grid; place-items: center; text-align: center; padding: 72px 24px; background: radial-gradient(900px 420px at 80% -10%, #dfe9ff 0%, rgba(223,233,255,0) 60%), radial-gradient(640px 320px at 0% 0%, #eef4ff 0%, rgba(238,244,255,0) 60%); }
  .code { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
  h1 { margin: 12px 0 0; font-size: clamp(34px, 5vw, 52px); line-height: 1.1; font-weight: 850; letter-spacing: -0.02em; }
  p { margin: 10px 0 0; font-size: 18px; color: var(--ink-2); }
  .btn { display: inline-flex; align-items: center; height: 46px; padding: 0 20px; margin-top: 28px; border-radius: 12px; font-weight: 650; font-size: 15px; background: var(--blue); border: 1px solid var(--blue); color: #fff; box-shadow: 0 8px 22px rgba(47,111,232,.26); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="/"><img src="/assets/sowonai-logo.png" alt="">SowonAI</a>
  </div>
</header>
<main>
  <div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>페이지를 찾을 수 없어요</p>
    <a class="btn" href="/">SowonAI · Home / 홈으로</a>
  </div>
</main>
</body>
</html>
